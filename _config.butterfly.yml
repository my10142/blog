# ======================================
#  Butterfly 主题配置文件
#  文档: https://butterfly.js.org/
# ======================================

nav:
  display_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder
  关于: /about/ || fas fa-user

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
  post:
    date_type: both
    date_format: date
    categories: true
    tags: true

index_top_img: false

inject:
  head:
    - <link rel="stylesheet" href="/css/banner.css">
    - <link rel="stylesheet" href="/css/article.css">
  bottom:
    - <script src="/js/banner.js"></script>

avatar:
  img: /img/avatar.png
  effect: false

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: 一些生活琐碎和感悟
    button:
      enable: false
  card_announcement:
    enable: true
    content: 欢迎来到我的博客~
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 6
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

footer:
  owner:
    enable: true
    since: 2026
  custom_text:
  copyright: true

code_blocks:
  theme: light
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true

social:
  fas fa-envelope: mailto:me@example.com || Email

local_search:
  enable: true
  preload: false
  top_n_per_article: 1
  unescape: false

math:
  use: mathjax
  per_page: true
  hide_scrollbar: false

beautify:
  enable: false
  field: site
  title_prefix:
  title_suffix:

wordcount:
  enable: true
  post_wordcount: true
  min2read: true

comments:
  use:
  text: true
  lazyload: false

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

related_post:
  enable: false